<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="5; url=https://bonjoev.github.io/C-STREAM/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "C-STEM Has Moved" }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
        }
        h1 { font-size: 2.5em; margin-bottom: 20px; }
        h2 { font-size: 1.8em; margin-bottom: 10px; font-weight: 400; }
        .acronym { 
            font-size: 1.1em; 
            opacity: 0.9; 
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .new-url {
            font-size: 1.5em;
            margin: 30px 0;
        }
        .new-url a {
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 15px 30px;
            border-radius: 10px;
            display: inline-block;
            transition: all 0.3s;
        }
        .new-url a:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .buttons { margin: 20px 0; }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin: 5px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
        .redirect-notice {
            margin-top: 30px;
            opacity: 0.8;
            font-size: 0.95em;
        }
        .countdown {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Project Has Moved!</h1>
        <h2>C-STREAM Framework</h2>
        <p class="acronym">
            <strong>C</strong>atholic · <strong>S</strong>cience · <strong>T</strong>echnology · <strong>R</strong>eligion · <strong>E</strong>ngineering · <strong>A</strong>rts · <strong>M</strong>ath
        </p>
        
        <div class="new-url">
            <a href="https://bonjoev.github.io/C-STREAM/">📚 bonjoev.github.io/C-STREAM</a>
        </div>
        
        <div class="buttons">
            <a href="https://github.com/bonJoeV/C-STREAM" class="btn btn-outline">💻 GitHub Repository</a>
        </div>
        
        <div class="redirect-notice">
            <p>Redirecting in <span class="countdown" id="countdown">5</span> seconds...</p>
        </div>
    </div>
    
    <script>
        let seconds = 5;
        const el = document.getElementById('countdown');
        setInterval(() => {
            seconds--;
            if (seconds >= 0) el.textContent = seconds;
        }, 1000);
    </script>
</body>
</html>
