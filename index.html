<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-STEM Curriculum - Redirecting to C-STREAM...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            color: white;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; opacity: 0.9; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            margin: 10px;
            font-size: 16px;
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-secondary { background: #333; color: white; }
        .btn-legacy { background: transparent; color: white; border: 2px solid white; margin-top: 20px; }
        .countdown { font-size: 0.9em; opacity: 0.7; margin-top: 30px; }
        .acronym { font-size: 0.9em; letter-spacing: 2px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 We've Moved!</h1>
        <p class="subtitle">The C-STREAM Framework has a new home</p>
        <p class="acronym"><strong>C</strong>atholic · <strong>S</strong>cience · <strong>T</strong>echnology · <strong>R</strong>eligion · <strong>E</strong>ngineering · <strong>A</strong>rts · <strong>M</strong>ath</p>
        
        <div style="margin: 30px 0;">
            <a href="https://bonjoev.github.io/C-STREAM/" class="btn btn-primary">📚 Go to C-STREAM</a>
            <a href="https://github.com/bonJoeV/C-STREAM" class="btn btn-secondary">💻 GitHub Repo</a>
        </div>
        
        <a href="README.html" class="btn btn-legacy">Stay on Legacy Site →</a>
        
        <p class="countdown">Redirecting to C-STREAM in <span id="timer">10</span> seconds...</p>
    </div>
    
    <script>
        let seconds = 10;
        const timer = document.getElementById('timer');
        const countdown = setInterval(() => {
            seconds--;
            timer.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = 'https://bonjoev.github.io/C-STREAM/';
            }
        }, 1000);
    </script>
</body>
</html>
